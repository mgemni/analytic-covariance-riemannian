[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "analytic-covariance-riemannian"
version = "0.1.0"
dependencies = [
    "numpy>=1.26.4",
    "scikit-learn>=1.5.2",
    "scipy>=1.15.3",
    "pyriemann>=0.11",
] # List any external packages your functions need here


# Tell only intsall this specific folder with setuptools
[tool.setuptools]
packages = ["analytic_covariance_riemannian"]